<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Loadstring // Obsidian Glass</title>
    <!-- Lucide Icons CDN for crisp monochrome vector icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* =====================================================================
           Premium Obsidian Glass Design System & Monochrome Tokens
           ===================================================================== */
        :root {
            --bg-base: #06070a;
            --bg-surface: rgba(255, 255, 255, 0.042);
            --bg-surface-hover: rgba(255, 255, 255, 0.075);
            --bg-input: rgba(8, 10, 14, 0.72);
            --border-subtle: rgba(255, 255, 255, 0.10);
            --border-medium: rgba(255, 255, 255, 0.18);
            --border-strong: rgba(255, 255, 255, 0.30);
            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.20), inset 0 -1px 0 rgba(255, 255, 255, 0.03);
            --glass-blur: blur(40px) saturate(185%);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1aa;
            --text-muted: #666670;
            --ok: #a5dfb6;
            --err: #e5909a;
            --radius-xl: 32px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --radius-pill: 999px;
            --mx: 50%;
            --my: 18%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html {
            background-color: var(--bg-base);
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-base);
            background-image:
                radial-gradient(ellipse 85% 55% at 50% -12%, rgba(255, 255, 255, 0.085), transparent 70%),
                radial-gradient(circle at 14% 85%, rgba(200, 206, 220, 0.04), transparent 52%),
                radial-gradient(circle at 86% 78%, rgba(175, 182, 198, 0.035), transparent 52%),
                linear-gradient(180deg, #08090d 0%, #050608 100%);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body.is-loading {
            overflow: hidden;
        }

        /* Subtle architectural grid & ambient glow */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 25%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 25%, transparent 85%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            width: 580px;
            height: 580px;
            top: -210px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: var(--radius-pill);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.055), transparent 70%);
            filter: blur(68px);
            pointer-events: none;
            z-index: 0;
        }

        /* =====================================================================
           Clean Pulse Keyframes
           ===================================================================== */
        @keyframes cleanPulseRing {
            0% {
                transform: scale(0.92);
                opacity: 0.55;
            }
            70% {
                transform: scale(1.38);
                opacity: 0;
            }
            100% {
                transform: scale(1.38);
                opacity: 0;
            }
        }

        @keyframes cleanLiveRipple {
            0% {
                transform: scale(1);
                opacity: 0.65;
            }
            75% {
                transform: scale(2.35);
                opacity: 0;
            }
            100% {
                transform: scale(2.35);
                opacity: 0;
            }
        }

        @keyframes cleanBreath {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.65;
            }
        }

        /* =====================================================================
           10-Second Precision Preloader Overlay
           ===================================================================== */
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(ellipse 75% 50% at 50% 15%, rgba(255, 255, 255, 0.07), transparent 70%),
                rgba(5, 6, 9, 0.92);
            backdrop-filter: blur(44px) saturate(185%);
            -webkit-backdrop-filter: blur(44px) saturate(185%);
            opacity: 1;
            visibility: visible;
            transition:
                opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                visibility 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .preloader.is-hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.025);
            pointer-events: none;
        }

        .preloader-card {
            position: relative;
            width: 100%;
            max-width: 340px;
            padding: 34px 28px 28px;
            border-radius: 30px;
            background: linear-gradient(
                165deg,
                rgba(255, 255, 255, 0.095) 0%,
                rgba(255, 255, 255, 0.03) 55%,
                rgba(255, 255, 255, 0.05) 100%
            );
            border: 1px solid var(--border-medium);
            box-shadow:
                0 32px 80px rgba(0, 0, 0, 0.72),
                var(--glass-highlight);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .preloader-ring-wrap {
            position: relative;
            width: 82px;
            height: 82px;
            display: grid;
            place-items: center;
        }

        .preloader-ring-wrap::before {
            content: "";
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            animation: cleanPulseRing 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
            pointer-events: none;
        }

        .preloader-svg {
            position: absolute;
            inset: 0;
            width: 82px;
            height: 82px;
            transform: rotate(-90deg);
        }

        .preloader-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.10);
            stroke-width: 2;
        }

        .preloader-circle-progress {
            fill: none;
            stroke: rgba(255, 255, 255, 0.92);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 226.19;
            stroke-dashoffset: 226.19;
            transition: stroke-dashoffset 0.08s linear;
        }

        .preloader-emblem {
            position: relative;
            z-index: 1;
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04));
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: var(--glass-highlight);
            display: grid;
            place-items: center;
            color: var(--text-primary);
        }

        .preloader-emblem svg {
            width: 20px;
            height: 20px;
            stroke-width: 2;
        }

        .preloader-text {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .preloader-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text-primary);
        }

        .preloader-sub {
            font-size: 12.5px;
            color: var(--text-secondary);
            min-height: 18px;
        }

        .preloader-meta {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preloader-stats {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .preloader-stats strong {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .preloader-bar {
            width: 100%;
            height: 3px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.09);
            overflow: hidden;
            position: relative;
        }

        .preloader-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.96));
            transition: width 0.08s linear;
        }

        .preloader-skip {
            appearance: none;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-pill);
            color: var(--text-muted);
            font-size: 11.5px;
            padding: 5px 12px;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .preloader-skip:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-subtle);
        }

        /* =====================================================================
           Main Glass Workspace Shell
           ===================================================================== */
        .glass-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1160px;
            border-radius: var(--radius-xl);
            background: linear-gradient(
                165deg,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(255, 255, 255, 0.026) 52%,
                rgba(255, 255, 255, 0.042) 100%
            );
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-subtle);
            box-shadow:
                0 36px 90px rgba(0, 0, 0, 0.72),
                var(--glass-highlight);
            overflow: hidden;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.65s ease 0.1s, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s;
        }

        body:not(.is-loading) .glass-shell {
            opacity: 1;
            transform: translateY(0);
        }

        /* Pointer-tracked clean specular glass reflection */
        .glass-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(
                560px circle at var(--mx) var(--my),
                rgba(255, 255, 255, 0.095),
                transparent 68%
            );
            pointer-events: none;
            z-index: 0;
        }

        .glass-shell > * {
            position: relative;
            z-index: 1;
        }

        header {
            padding: 22px 28px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.018);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-mark {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.19), rgba(255, 255, 255, 0.04));
            border: 1px solid var(--border-medium);
            box-shadow: var(--glass-highlight);
            display: grid;
            place-items: center;
            color: var(--text-primary);
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            border: 1px solid rgba(165, 223, 182, 0.35);
            animation: cleanPulseRing 2.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
            pointer-events: none;
        }

        .brand-mark svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
        }

        .brand-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text-primary);
        }

        .brand-tag {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ok);
            padding: 2px 8px 2px 18px;
            border-radius: var(--radius-pill);
            background: rgba(165, 223, 182, 0.08);
            border: 1px solid rgba(165, 223, 182, 0.24);
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .brand-tag::before {
            content: "";
            position: absolute;
            left: 7px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 8px rgba(165, 223, 182, 0.7);
            animation: cleanBreath 2.2s ease-in-out infinite;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .header-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill-badge {
            font-size: 12px;
            font-weight: 500;
            padding: 6px 13px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--glass-highlight);
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .status-dot {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }

        .status-dot::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: currentColor;
            pointer-events: none;
        }

        .pill-badge.status-ready {
            color: var(--ok);
            border-color: rgba(165, 223, 182, 0.22);
        }

        .pill-badge.status-ready .status-dot {
            background: var(--ok);
            color: var(--ok);
            box-shadow: 0 0 8px rgba(165, 223, 182, 0.55);
        }

        .pill-badge.status-ready .status-dot::after {
            animation: cleanLiveRipple 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        .pill-badge.status-busy {
            color: var(--text-primary);
            border-color: var(--border-medium);
        }

        .pill-badge.status-busy .status-dot {
            background: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.75);
        }

        .pill-badge.status-busy .status-dot::after {
            animation: cleanLiveRipple 1.35s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        .pill-badge.status-ok {
            color: var(--ok);
            border-color: rgba(165, 223, 182, 0.28);
        }

        .pill-badge.status-ok .status-dot {
            background: var(--ok);
            color: var(--ok);
            box-shadow: 0 0 8px rgba(165, 223, 182, 0.65);
        }

        .pill-badge.status-ok .status-dot::after {
            animation: cleanLiveRipple 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        .pill-badge.status-err {
            color: var(--err);
            border-color: rgba(229, 144, 154, 0.28);
        }

        .pill-badge.status-err .status-dot {
            background: var(--err);
            color: var(--err);
        }

        /* =====================================================================
           Workspace Grid & Clean Config Strip
           ===================================================================== */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            padding: 24px 28px 28px;
        }

        @media (max-width: 860px) {
            body {
                padding: 16px 12px;
            }
            .glass-shell {
                border-radius: 26px;
            }
            header {
                padding: 18px 20px;
            }
            .workspace {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 20px;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 20px;
            border-radius: var(--radius-lg);
            background: var(--bg-surface);
            backdrop-filter: blur(26px) saturate(170%);
            -webkit-backdrop-filter: blur(26px) saturate(170%);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--glass-highlight), 0 14px 34px rgba(0, 0, 0, 0.32);
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .panel-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .panel-meta {
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .config-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.028);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .segmented {
            display: inline-flex;
            padding: 3px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 2px;
        }

        .seg-btn {
            appearance: none;
            background: transparent;
            border: none;
            border-radius: 7px;
            color: var(--text-secondary);
            font-size: 11.5px;
            font-weight: 500;
            padding: 5px 10px;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .seg-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            transform: none;
        }

        .seg-btn.is-active {
            background: rgba(255, 255, 255, 0.16);
            color: var(--text-primary);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        }

        textarea {
            width: 100%;
            height: 330px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            padding: 16px;
            font-size: 13px;
            line-height: 1.62;
            font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            resize: vertical;
            outline: none;
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.45);
            transition: border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        textarea:focus {
            background: rgba(12, 15, 22, 0.85);
            border-color: var(--border-medium);
            box-shadow:
                inset 0 2px 12px rgba(0, 0, 0, 0.45),
                0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button,
        .upload-btn {
            appearance: none;
            background: rgba(255, 255, 255, 0.065);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            padding: 10px 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            box-shadow: var(--glass-highlight);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.16s ease;
            user-select: none;
            text-decoration: none;
        }

        button svg,
        .upload-btn svg {
            width: 15px;
            height: 15px;
            stroke-width: 2;
            flex-shrink: 0;
        }

        button:hover:not(:disabled),
        .upload-btn:hover {
            background: var(--bg-surface-hover);
            border-color: var(--border-medium);
            transform: translateY(-1px);
        }

        button:active:not(:disabled),
        .upload-btn:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(224, 227, 233, 0.88));
            color: #08090c;
            border-color: rgba(255, 255, 255, 0.92);
            font-weight: 600;
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(180deg, #ffffff, #e4e7ed);
            border-color: #ffffff;
        }

        input[type="file"] {
            display: none;
        }

        .raw-box {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--border-subtle);
            font-size: 12px;
            font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: var(--text-muted);
            word-break: break-all;
        }

        .raw-box.visible {
            display: flex;
        }

        .raw-box span {
            color: var(--text-secondary);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translate(-50%, 14px);
            background: rgba(24, 26, 33, 0.88);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid var(--border-medium);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.58), var(--glass-highlight);
            color: var(--text-primary);
            padding: 11px 20px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (prefers-reduced-motion: reduce) {
            .preloader,
            .preloader-circle-progress,
            .preloader-bar-fill,
            .glass-shell {
                transition-duration: 0.15s !important;
            }
            .preloader-ring-wrap::before,
            .brand-mark::after,
            .brand-tag::before,
            .status-dot::after {
                animation: none !important;
            }
        }
    </style>
</head>
<body class="is-loading">

<!-- =========================================================================
     10-Second Precision Glass Preloader
     ========================================================================= -->
<div class="preloader" id="preloader" role="status" aria-live="polite" aria-label="Loading Auto Loadstring workspace">
    <div class="preloader-card">
        <div class="preloader-ring-wrap" aria-hidden="true">
            <svg class="preloader-svg" viewBox="0 0 82 82">
                <circle class="preloader-circle-bg" cx="41" cy="41" r="36"></circle>
                <circle class="preloader-circle-progress" id="preloaderRing" cx="41" cy="41" r="36"></circle>
            </svg>
            <div class="preloader-emblem">
                <i data-lucide="zap"></i>
            </div>
        </div>

        <div class="preloader-text">
            <div class="preloader-title">Auto Loadstring</div>
            <div class="preloader-sub" id="preloaderStep">Initializing obsidian glass surface…</div>
        </div>

        <div class="preloader-meta">
            <div class="preloader-stats">
                <span id="preloaderPercent">0%</span>
                <span id="preloaderTimer"><strong>10.0s</strong> remaining</span>
            </div>
            <div class="preloader-bar" aria-hidden="true">
                <div class="preloader-bar-fill" id="preloaderBarFill"></div>
            </div>
        </div>

        <button type="button" class="preloader-skip" id="btnSkipPreloader" onclick="dismissPreloader()">
            Skip intro
        </button>
    </div>
</div>

<!-- =========================================================================
     Main Application Workspace
     ========================================================================= -->
<main class="glass-shell" id="glassShell">
    <header>
        <div class="brand">
            <div class="brand-mark"><i data-lucide="zap"></i></div>
            <div>
                <div class="brand-title-row">
                    <span class="brand-title">Auto Loadstring</span>
                    <span class="brand-tag">Live</span>
                </div>
                <div class="brand-sub">Raw Script Publisher &amp; Executor Loader Generator</div>
            </div>
        </div>

        <div class="header-meta">
            <span class="pill-badge" id="charCount">0 chars</span>
            <span class="pill-badge status-ready" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Live</span>
            </span>
        </div>
    </header>

    <section class="workspace">
        <!-- Source Panel -->
        <div class="panel">
            <div class="panel-head">
                <div class="panel-title-group">
                    <span class="panel-label">Script Source</span>
                </div>
                <label class="upload-btn" for="fileUpload">
                    <i data-lucide="upload"></i>
                    <span>Upload File</span>
                </label>
                <input type="file" id="fileUpload" accept=".lua,.luau,.txt">
            </div>

            <div class="config-bar">
                <div class="segmented" role="group" aria-label="Loadstring template style">
                    <button type="button" class="seg-btn is-active" data-style="clean" onclick="setTemplateStyle('clean', this)">Standard</button>
                    <button type="button" class="seg-btn" data-style="protected" onclick="setTemplateStyle('protected', this)">Protected</button>
                    <button type="button" class="seg-btn" data-style="raw" onclick="setTemplateStyle('raw', this)">Raw URL</button>
                </div>

                <span class="panel-meta">Always fresh fetch</span>
            </div>

            <textarea id="sourceInput" placeholder="-- วางโค้ด Lua / Luau ของคุณที่นี่&#10;print('Hello from Auto Loadstring')"></textarea>

            <div class="actions">
                <button type="button" class="btn-primary" id="btnGenerate" onclick="generateLoadstring()">
                    <i data-lucide="sparkles"></i>
                    <span>Generate Loadstring</span>
                </button>
                <button type="button" onclick="clearAll()">
                    <i data-lucide="trash-2"></i>
                    <span>Clear</span>
                </button>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="panel">
            <div class="panel-head">
                <div class="panel-title-group">
                    <span class="panel-label">Loadstring Output</span>
                </div>
                <span class="panel-meta" id="lineInfo">—</span>
            </div>

            <div class="config-bar">
                <span class="panel-meta" id="templateHint">Format: HttpGet loader</span>
                <span class="panel-meta" id="byteInfo">0 B</span>
            </div>

            <textarea id="outputArea" readonly placeholder='loadstring(game:HttpGet("https://pastefy.app/.../raw", true))()'></textarea>

            <div class="raw-box" id="rawUrlBox">
                <div>RAW: <span id="rawUrlText"></span></div>
            </div>

            <div class="actions">
                <button type="button" onclick="copyLoadstring()">
                    <i data-lucide="copy"></i>
                    <span>Copy Loadstring</span>
                </button>
                <button type="button" onclick="copyRawUrl()">
                    <i data-lucide="link"></i>
                    <span>Copy Raw URL</span>
                </button>
                <button type="button" onclick="downloadScript()">
                    <i data-lucide="download"></i>
                    <span>Export .lua</span>
                </button>
            </div>
        </div>
    </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
    const PRELOADER_DURATION_MS = 10000; // 10 seconds
    const RING_CIRCUMFERENCE = 2 * Math.PI * 36; // ~226.19

    // DOM Element References
    const preloader = document.getElementById('preloader');
    const preloaderRing = document.getElementById('preloaderRing');
    const preloaderBarFill = document.getElementById('preloaderBarFill');
    const preloaderPercent = document.getElementById('preloaderPercent');
    const preloaderTimer = document.getElementById('preloaderTimer');
    const preloaderStep = document.getElementById('preloaderStep');

    const glassShell = document.getElementById('glassShell');
    const sourceInput = document.getElementById('sourceInput');
    const outputArea = document.getElementById('outputArea');
    const fileUpload = document.getElementById('fileUpload');
    const charCount = document.getElementById('charCount');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const lineInfo = document.getElementById('lineInfo');
    const byteInfo = document.getElementById('byteInfo');
    const templateHint = document.getElementById('templateHint');
    const rawUrlBox = document.getElementById('rawUrlBox');
    const rawUrlText = document.getElementById('rawUrlText');
    const btnGenerate = document.getElementById('btnGenerate');

    let currentRawUrl = '';
    let templateStyle = 'clean';
    let toastTimer;
    let preloaderTimerId = null;
    let preloaderStartTime = performance.now();
    let preloaderDismissed = false;

    preloaderRing.style.strokeDasharray = RING_CIRCUMFERENCE.toFixed(2);
    preloaderRing.style.strokeDashoffset = RING_CIRCUMFERENCE.toFixed(2);

    const loadingStages = [
        { at: 0, text: 'Initializing obsidian glass surface…' },
        { at: 25, text: 'Verifying pastefy.app & clipboard bridge…' },
        { at: 55, text: 'Calibrating Luau loader templates…' },
        { at: 82, text: 'Polishing specular reflections…' },
        { at: 96, text: 'Live workspace ready' }
    ];

    /**
     * Updates the 10-second preloader progress ring, bar, and countdown.
     */
    function tickPreloader(now) {
        if (preloaderDismissed) return;

        const elapsed = Math.min(now - preloaderStartTime, PRELOADER_DURATION_MS);
        const progress = elapsed / PRELOADER_DURATION_MS;
        const pct = Math.round(progress * 100);
        const remainingSec = Math.max(0, (PRELOADER_DURATION_MS - elapsed) / 1000).toFixed(1);

        preloaderRing.style.strokeDashoffset = (RING_CIRCUMFERENCE * (1 - progress)).toFixed(2);
        preloaderBarFill.style.width = `${(progress * 100).toFixed(1)}%`;
        preloaderPercent.textContent = `${pct}%`;
        preloaderTimer.innerHTML = `<strong>${remainingSec}s</strong> remaining`;

        for (let i = loadingStages.length - 1; i >= 0; i--) {
            if (pct >= loadingStages[i].at) {
                preloaderStep.textContent = loadingStages[i].text;
                break;
            }
        }

        if (elapsed >= PRELOADER_DURATION_MS) {
            dismissPreloader();
            return;
        }

        preloaderTimerId = window.requestAnimationFrame(tickPreloader);
    }

    /**
     * Dismisses the preloader cleanly and reveals the main glass workspace.
     */
    function dismissPreloader() {
        if (preloaderDismissed) return;
        preloaderDismissed = true;

        if (preloaderTimerId !== null) {
            window.cancelAnimationFrame(preloaderTimerId);
            preloaderTimerId = null;
        }

        preloaderRing.style.strokeDashoffset = '0';
        preloaderBarFill.style.width = '100%';
        preloaderPercent.textContent = '100%';
        preloaderTimer.innerHTML = '<strong>0.0s</strong> remaining';

        try {
            document.body.classList.remove('is-loading');
            if (preloader) {
                preloader.classList.add('is-hidden');
                window.setTimeout(() => {
                    if (preloader && preloader.parentNode) {
                        preloader.remove();
                    }
                }, 680);
            }
        } catch (_) {
            document.body.classList.remove('is-loading');
            if (preloader) preloader.style.display = 'none';
        }
    }

    /**
     * Renders Lucide icons safely.
     */
    function refreshIcons() {
        try {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        } catch (_) {}
    }

    function setGenerateButton(label, iconName) {
        btnGenerate.innerHTML = `<i data-lucide="${iconName}"></i><span>${label}</span>`;
        refreshIcons();
    }

    // Pointer-tracked specular highlight across .glass-shell
    glassShell.addEventListener('pointermove', (e) => {
        const rect = glassShell.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        glassShell.style.setProperty('--mx', `${x.toFixed(1)}%`);
        glassShell.style.setProperty('--my', `${y.toFixed(1)}%`);
    });

    glassShell.addEventListener('pointerleave', () => {
        glassShell.style.setProperty('--mx', '50%');
        glassShell.style.setProperty('--my', '18%');
    });

    function formatBytes(bytes) {
        if (!bytes) return '0 B';
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function updateStats() {
        const text = sourceInput.value;
        charCount.textContent = `${text.length.toLocaleString()} chars`;
        const lines = text.length ? text.split('\n').length : 0;
        lineInfo.textContent = lines ? `${lines.toLocaleString()} lines` : '—';
        const utf8Bytes = new TextEncoder().encode(text).length;
        byteInfo.textContent = formatBytes(utf8Bytes);
    }

    function setStatus(text, type = 'ready') {
        statusText.textContent = text;
        statusBadge.className = `pill-badge status-${type}`;
    }

    function setTemplateStyle(style, btnEl) {
        templateStyle = style;
        document.querySelectorAll('.seg-btn').forEach((el) => el.classList.remove('is-active'));
        if (btnEl) btnEl.classList.add('is-active');

        const hints = {
            clean: 'Format: HttpGet loader',
            protected: 'Format: Protected pcall loader',
            raw: 'Format: Direct raw URL'
        };
        templateHint.textContent = hints[style] || hints.clean;
        rebuildOutput();
    }

    function buildSnippetFromUrl(url) {
        if (!url) return '';

        if (templateStyle === 'raw') {
            return url;
        }
        if (templateStyle === 'protected') {
            return [
                'local ok, err = pcall(function()',
                `    loadstring(game:HttpGet("${url}", true))()`,
                'end)',
                'if not ok then warn("[Loader]", err) end'
            ].join('\n');
        }
        return `loadstring(game:HttpGet("${url}", true))()`;
    }

    function rebuildOutput() {
        if (!currentRawUrl) return;
        outputArea.value = buildSnippetFromUrl(currentRawUrl);
    }

    sourceInput.addEventListener('input', updateStats);

    fileUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            sourceInput.value = event.target.result;
            updateStats();
            showToast(`โหลดไฟล์ "${file.name}" แล้ว`);
        };
        reader.onerror = () => {
            showToast('ไม่สามารถอ่านไฟล์ได้');
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    /**
     * Extracts a Pastefy paste ID from various API response shapes.
     */
    function extractPastefyId(data) {
        if (!data || typeof data !== 'object') return null;
        if (data.paste && typeof data.paste.id === 'string' && data.paste.id) {
            return data.paste.id;
        }
        if (typeof data.id === 'string' && data.id) {
            return data.id;
        }
        if (typeof data.paste_id === 'string' && data.paste_id) {
            return data.paste_id;
        }
        return null;
    }

    async function generateLoadstring() {
        const rawCode = sourceInput.value;
        if (!rawCode.trim()) {
            showToast('กรุณาใส่โค้ดสคริปต์ก่อน');
            return;
        }

        btnGenerate.disabled = true;
        setGenerateButton('Uploading...', 'loader-2');
        setStatus('Uploading', 'busy');

        let rawUrl = null;

        // Primary paste provider: pastefy.app
        try {
            const res = await fetch('https://pastefy.app/api/v2/paste', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    title: 'script.lua',
                    content: rawCode,
                    type: 'PASTE',
                    visibility: 'UNLISTED'
                })
            });

            if (res.ok) {
                const json = await res.json();
                const pasteId = extractPastefyId(json);
                if (pasteId) {
                    rawUrl = `https://pastefy.app/${encodeURIComponent(pasteId)}/raw`;
                }
            }
        } catch (_) {}

        // Fallback paste provider: paste.rs
        if (!rawUrl) {
            try {
                const res2 = await fetch('https://paste.rs/', {
                    method: 'POST',
                    body: rawCode
                });
                if (res2.ok) {
                    const urlText2 = (await res2.text()).trim();
                    if (urlText2.startsWith('http')) {
                        rawUrl = urlText2;
                    }
                }
            } catch (_) {}
        }

        btnGenerate.disabled = false;
        setGenerateButton('Generate Loadstring', 'sparkles');

        if (rawUrl) {
            currentRawUrl = rawUrl;
            outputArea.value = buildSnippetFromUrl(rawUrl);
            rawUrlText.textContent = rawUrl;
            rawUrlBox.classList.add('visible');
            setStatus('Live Ready', 'ok');
            showToast('สร้าง Loadstring สำเร็จ');
        } else {
            setStatus('Upload Failed', 'err');
            showToast('อัปโหลดไม่สำเร็จ ลองใหม่อีกครั้ง');
        }
    }

    function copyTextToClipboard(text, successMessage) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(text)
                .then(() => showToast(successMessage))
                .catch(() => fallbackCopy(text, successMessage));
        } else {
            fallbackCopy(text, successMessage);
        }
    }

    function fallbackCopy(text, successMessage) {
        try {
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            tempInput.setAttribute('readonly', '');
            tempInput.style.position = 'fixed';
            tempInput.style.opacity = '0';
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast(successMessage);
        } catch (_) {
            showToast('ไม่สามารถคัดลอกได้');
        }
    }

    function copyLoadstring() {
        if (!outputArea.value) return showToast('ยังไม่มี Loadstring ให้คัดลอก');
        copyTextToClipboard(outputArea.value, 'คัดลอก Loadstring แล้ว');
    }

    function copyRawUrl() {
        if (!currentRawUrl) return showToast('ยังไม่มีลิงก์ Raw');
        copyTextToClipboard(currentRawUrl, 'คัดลอก Raw URL แล้ว');
    }

    function downloadScript() {
        const code = sourceInput.value;
        if (!code.trim()) return showToast('ยังไม่มีโค้ดสำหรับดาวน์โหลด');

        const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'script.lua';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('ดาวน์โหลด script.lua แล้ว');
    }

    function clearAll() {
        sourceInput.value = '';
        outputArea.value = '';
        currentRawUrl = '';
        rawUrlText.textContent = '';
        rawUrlBox.classList.remove('visible');
        setStatus('Live', 'ready');
        updateStats();
        showToast('ล้างข้อมูลแล้ว');
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    // Initialize icons, counters, and 10-second preloader
    refreshIcons();
    updateStats();
    preloaderStartTime = performance.now();
    preloaderTimerId = window.requestAnimationFrame(tickPreloader);
</script>

</body>
</html>
